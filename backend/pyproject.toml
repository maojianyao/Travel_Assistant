[project]
name = "travel-assistant-backend"
version = "1.0.0"
description = "智能旅行助手后端服务（FastAPI + LangChain 多智能体）"
requires-python = ">=3.12"

dependencies = [
    # langchain 多智能体
    "langchain>=1.3.15",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai>=0.2.0",

    # FastAPI 和相关依赖
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # HTTP客户端
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",               # 代码中未直接导入，确认无用可删除
    "requests>=2.31.0",

    # 环境变量与表单解析
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",

    # 日志
    "loguru>=0.7.0",

    # MCP相关
    "fastmcp>=2.0.0",                # 代码中未直接导入（MCP走langchain-mcp-adapters），确认无用可删除
    "uv>=0.8.0",                     # uv是命令行工具，作为运行依赖意义不大，确认无用可删除

    # 其他工具
    "python-dateutil>=2.8.2",        # 代码中未直接导入，确认无用可删除
    "huggingface_hub>=0.25.0",       # 代码中未直接导入，确认无用可删除
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
# 项目以脚本方式运行（代码通过 backend.app.* 从仓库根目录导入），
# 无需把 backend 本身构建安装为包
package = false